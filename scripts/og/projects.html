<!doctype html>
<!-- Link-preview card for /projects (what iMessage, Mail, and social apps show
     when someone sends the link). Rendered to public/og/projects.png by
     scripts/og/render.cjs. Text and two bars only: no photos of children here
     until releases are confirmed. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { background: #FFFFFF; font-family: Lato, 'Helvetica Neue', sans-serif; color: #3D3D4F;
         display: grid; grid-template-columns: 1.42fr 1fr; overflow: hidden; }
  .left { padding: 60px 32px 54px 72px; display: flex; flex-direction: column; }
  .brand { font-weight: 900; letter-spacing: 5px; font-size: 18px; color: #712BBE; text-transform: uppercase; }
  .rule { width: 72px; height: 5px; background: #E07A5F; margin: 18px 0 30px; }
  h1 { font-family: Lora, Georgia, serif; font-weight: 700; font-size: 66px; line-height: 1.08; color: #1C1C2E; margin: 0; }
  h1 span { color: #712BBE; }
  .sub { margin-top: auto; font-size: 26px; line-height: 1.3; color: #3D3D4F; }
  .sub b { color: #1C1C2E; font-weight: 900; }
  .url { margin-top: 12px; font-weight: 700; font-size: 22px; color: #A84018; }
  .right { background: #EDE0FF; display: flex; align-items: center; padding: 0 48px; }
  .fig { width: 100%; background: #FFFFFF; border-radius: 24px; padding: 40px 36px 34px; box-shadow: 0 20px 50px rgba(58, 20, 112, .14); }
  .lab { font-weight: 900; font-size: 22px; color: #1C1C2E; margin-bottom: 12px; }
  .bar { position: relative; height: 16px; border-radius: 99px; background: #EDE0FF; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
  .bar em { position: absolute; right: -4px; top: 50%; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%;
            background: #712BBE; border: 4px solid #FFFFFF; box-shadow: 0 0 0 8px rgba(113, 43, 190, .22); box-sizing: border-box; }
  .cap { font-size: 22px; margin: 12px 0 34px; }
  .cap:last-of-type { margin-bottom: 26px; }
  .cap b { color: #1C1C2E; }
  .cap b.v { color: #712BBE; }
  .axis { display: flex; justify-content: space-between; border-top: 2px solid #EDE0FF; padding-top: 12px; font-size: 17px; font-weight: 700; color: #646474; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">Restore the Last</div>
    <div class="rule"></div>
    <h1>They’re safe now.<br><span>So why can’t<br>they sleep?</span></h1>
    <div class="sub"><b>$300</b> puts a CalmBox in a home caring for them.</div>
    <div class="url">restorethelast.org/projects</div>
  </div>
  <div class="right">
    <div class="fig">
      <div class="lab">The danger</div>
      <div class="bar"><i style="width: 24%; background: #1C1C2E"></i></div>
      <div class="cap"><b>Over.</b> They’re safe now.</div>
      <div class="lab">The body’s alarm</div>
      <div class="bar"><i style="width: 100%; background: #712BBE"></i><em></em></div>
      <div class="cap"><b class="v">Still on.</b> Day and night.</div>
      <div class="axis"><span>When it happened</span><span>Today</span></div>
    </div>
  </div>
</body>
</html>
