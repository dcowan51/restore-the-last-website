# Admin UI config. Fields here mirror src/content/config.ts -- that Zod schema is
# what actually enforces correctness at build time, so if you add a field, add it
# in both places or the build will reject what the editor saves.

backend:
  name: github
  repo: dcowan51/restore-the-last-website
  branch: main
  # Netlify brokers the GitHub login, so there's no auth server to run.
  # Requires the one-time OAuth setup in Netlify (see ADMIN-SETUP.md).
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Saves land as real commits, so the message explains itself in the repo history.
commit_messages:
  create: 'Add project: {{slug}}'
  update: 'Update project: {{slug}}'
  delete: 'Remove project: {{slug}}'
  uploadMedia: 'Upload {{path}}'
  deleteMedia: 'Delete {{path}}'

media_folder: public/uploads
public_folder: /uploads

collections:
  # Site-wide lists that used to live in code. Editing here commits to the repo
  # and redeploys, same as saving a project.
  - name: settings
    label: Site Settings
    files:
      - name: populations
        label: Serving Categories
        file: src/data/populations.json
        description: >-
          The "Who it serves" categories available on projects. Add one here,
          save, and it becomes available in every project's "Who it serves"
          picker and the Serving filter on /projects after the site rebuilds
          (a couple of minutes).
        fields:
          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Label, widget: string, hint: 'What visitors see — e.g. "Foster Youth".' }
              - name: value
                label: ID
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, and dashes only — e.g. "foster-youth"']
                hint: >-
                  Internal ID, set once and never changed — projects are tagged
                  by this ID, so renaming or deleting one that's in use orphans
                  those tags. To reword what visitors see, change the Label.

      - name: projectTypes
        label: Project Types
        file: src/data/projectTypes.json
        description: >-
          The kinds of project the fund pays for. A new type shows up in the
          project editor and the /projects filter pills after the site rebuilds.
          Note: new types display with the standard deployment layout and a
          neutral badge — the film-style layout is exclusive to Documentary.
        fields:
          - name: types
            label: Types
            label_singular: Type
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Label, widget: string, hint: 'Singular, shown on the badge — e.g. "Retreat".' }
              - { name: plural, label: Plural, widget: string, required: false, hint: 'Shown on the filter pill — e.g. "Retreats". Leave blank to reuse the Label.' }
              - name: value
                label: ID
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, and dashes only — e.g. "retreat"']
                hint: >-
                  Internal ID, set once and never changed. Don't delete
                  "deployment", "documentary", "training", or "research" —
                  the site's layouts key off those.

      - name: projectStatuses
        label: Project Statuses
        file: src/data/projectStatuses.json
        description: >-
          The lifecycle labels a project can carry. "Fully Funded" (ID: funded)
          is special — it closes a project: Give buttons disappear and the card
          says "See the outcome". New statuses behave like an open project.
          For hiding a project entirely, use the Draft toggle on the project
          itself, not a status.
        fields:
          - name: statuses
            label: Statuses
            label_singular: Status
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Label, widget: string, hint: 'What visitors see on the badge — e.g. "Paused".' }
              - name: value
                label: ID
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, and dashes only — e.g. "paused"']
                hint: >-
                  Internal ID, set once and never changed. Don't delete or
                  rename "funded" — it's what marks a project closed.

  - name: projects
    label: Projects
    label_singular: Project
    description: >-
      Everything the fund pays for. These appear on the homepage carousel (when
      Featured is on), on the Give page, and on /projects.
    folder: src/content/projects
    extension: json
    format: json
    create: true
    delete: true
    # The filename becomes the URL: /projects/<filename>
    slug: '{{fields.title | slugify}}'
    summary: '{{title}} — {{location}}'
    sortable_fields: [order, title, status]
    view_groups:
      - label: Type
        field: type
      - label: Draft
        field: draft
    fields:
      - { name: title, label: Title, widget: string, hint: 'Shows on the card and as the page heading.' }

      - name: draft
        label: Draft — hide from the site
        widget: boolean
        default: false
        hint: >-
          ON = the project saves like normal but appears NOWHERE on the site —
          no card, no filters, no page. Turn it off when you're ready to
          publish. (Saving still commits to the repo either way.)

      - name: type
        label: Type
        widget: relation
        collection: settings
        file: projectTypes
        default: deployment
        value_field: '{{types.*.value}}'
        display_fields: ['{{types.*.label}}']
        search_fields: ['{{types.*.label}}']
        hint: 'Documentary swaps the card and detail page to film fields. Add new types under Site Settings → Project Types.'

      - name: status
        label: Status
        widget: relation
        collection: settings
        file: projectStatuses
        default: open
        value_field: '{{statuses.*.value}}'
        display_fields: ['{{statuses.*.label}}']
        search_fields: ['{{statuses.*.label}}']
        hint: '"Fully Funded" closes the project (hides Give buttons). Add new statuses under Site Settings → Project Statuses.'

      - { name: featured, label: Show on homepage, widget: boolean, default: true }
      - { name: order, label: Sort order, widget: number, default: 100, value_type: int, hint: 'Lower shows first. Leave gaps (10, 20, 30) so you can reorder without renumbering everything.' }

      - { name: location, label: Where, widget: string, hint: 'e.g. "Phoenix, Arizona" or "El Salvador".' }

      - name: populations
        label: Who it serves
        widget: relation
        collection: settings
        file: populations
        multiple: true
        required: false
        default: []
        value_field: '{{categories.*.value}}'
        display_fields: ['{{categories.*.label}}']
        search_fields: ['{{categories.*.label}}']
        hint: 'Drives the "Serving" filter on /projects. Need a category that isn''t listed? Add it under Site Settings → Serving Categories first.'

      - { name: purpose, label: Purpose, widget: text, required: false, hint: 'One sentence on why this exists. Shows as "The Purpose".' }

      - name: partner
        label: Partner organization
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: name, label: Name, widget: string, required: false }
          - { name: url, label: Website, widget: string, required: false, hint: 'Full URL including https://. Leave blank to hide the link.' }

      - { name: coverImage, label: Cover photo, widget: image, hint: 'Landscape works best. Keep it under ~1600px wide — bigger just slows the page down.' }

      - { name: summary, label: Summary, widget: text, hint: '2–3 sentences. The card shows the first 4 lines; the full text shows on the detail page.' }
      - { name: whatWeFund, label: What funding covers, widget: text }

      - { name: goal, label: Funding goal ($), widget: number, required: false, value_type: int, min: 1, hint: 'Leave EMPTY for ongoing work with no fixed goal — the card then shows "Ongoing".' }

      - { name: giveUrl, label: Give link (this project only), widget: string, required: false, hint: "Full URL of this project's own giving page (its Crowded collection link). When set, the Give buttons on this project's page send donors here as a gift designated to THIS project. Leave empty to send donors to the shared general-fund link." }

      # ---- Deployment-shaped fields ----
      - { name: population, label: 'Who it serves (in plain words)', widget: string, required: false, hint: 'Deployments only. Shows under the title on the card.' }
      - { name: whyThisPopulation, label: Why this population, widget: text, required: false, hint: 'Deployments only. Blank line between paragraphs.' }

      # ---- Film-shaped fields ----
      - { name: subtitle, label: Subtitle / tagline, widget: string, required: false, hint: 'Documentaries only. Replaces the summary on the card.' }
      - { name: whyThisMatters, label: Why this matters, widget: text, required: false, hint: 'Documentaries only. Blank line between paragraphs.' }

      - name: media
        label: Film details
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: productionPartner, label: Produced with, widget: string, required: false }
          - { name: targetRelease, label: Target release, widget: string, required: false, hint: 'e.g. "Spring 2027".' }
          - { name: runtime, label: Runtime, widget: string, required: false }
          - { name: trailerUrl, label: Trailer URL, widget: string, required: false }
