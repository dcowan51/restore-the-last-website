<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep the editor out of search results. It's login-gated either way, but
         there's no reason for it to appear alongside the public pages. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager — Restore the Last</title>
  </head>
  <body>
    <!-- Sveltia CMS: a maintained, drop-in successor to Decap/Netlify CMS.
         Reads public/admin/config.yml, writes commits straight to GitHub, and
         Netlify rebuilds from those commits like any other push. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
