[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The Netlify subdomain serves a full duplicate of the site. Redirecting it to
# the primary domain (together with the canonical tags in BaseLayout) keeps
# search engines from indexing two competing copies.
[[redirects]]
  from = "https://restore-the-last.netlify.app/*"
  to = "https://restorethelast.org/:splat"
  status = 301
  force = true

# Short links for the Ugly Sweater Slam (flyers, social posts, saying it out loud).
# 302, not 301, so browsers don't cache them and they can point elsewhere later.
[[redirects]]
  from = "/slam"
  to = "/pickleball/"
  status = 302

[[redirects]]
  from = "/uglysweaterslam"
  to = "/pickleball/"
  status = 302
